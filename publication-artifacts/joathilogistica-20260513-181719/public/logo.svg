<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="560" viewBox="0 0 1700 560" version="1.1">
<title>Joathi Logistica - Logo oficial vector editable</title>
<defs>
  <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0E3B2E"/>
    <stop offset="100%" stop-color="#082A21"/>
  </linearGradient>
  <linearGradient id="yellowGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#F2B200"/>
    <stop offset="100%" stop-color="#FFD45A"/>
  </linearGradient>
  <radialGradient id="radarGrad" cx="50%" cy="45%" r="70%">
    <stop offset="0%" stop-color="#0F4A39"/>
    <stop offset="100%" stop-color="#06251D"/>
  </radialGradient>
  <filter id="shadowSoft" x="-25%" y="-25%" width="150%" height="150%">
    <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#000000" flood-opacity="0.18"/>
  </filter>
  <filter id="shadowSmall" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.16"/>
  </filter>
  <style>
    .brand-title { font-family: Montserrat, Arial, Helvetica, sans-serif; font-weight: 900; letter-spacing: 4px; }
    .brand-sub { font-family: Montserrat, Arial, Helvetica, sans-serif; font-weight: 700; letter-spacing: 12px; }
    .headline { font-family: Montserrat, Arial, Helvetica, sans-serif; font-weight: 900; letter-spacing: 1px; }
    .body { font-family: Montserrat, Arial, Helvetica, sans-serif; font-weight: 500; }
    .body-bold { font-family: Montserrat, Arial, Helvetica, sans-serif; font-weight: 800; }
    .small { font-family: Montserrat, Arial, Helvetica, sans-serif; font-weight: 600; letter-spacing: .5px; }
  </style>
</defs>
<rect width="1700" height="560" fill="#FFFFFF"/><g id="LOGO_OFICIAL_JOATHI_LOGISTICA_HORIZONTAL">
  
<g id="ISOTIPO_OFICIAL_JL" transform="translate(30,80) scale(0.74)">
  <!-- J vertical -->
  <path d="M126 26 L178 26 L178 180 C178 242 139 286 70 286 L18 286 L29 236 L68 236 C107 236 126 213 126 178 Z" fill="#0E3B2E"/>
  <!-- L vertical and horizontal -->
  <path d="M214 26 L266 26 L266 226 L392 226 L392 276 L214 276 Z" fill="#0E3B2E"/>
  <!-- green baseline under L/J -->
  <path d="M188 286 L345 286 L371 252 L404 252 L384 304 L188 304 Z" fill="#0E3B2E" opacity="0.98"/>
  <!-- yellow motion lines and arrow -->
  <path d="M205 316 L390 316 L390 286 L486 340 L390 394 L390 364 L142 364 L168 340 L128 340 L150 316 Z" fill="url(#yellowGrad)"/>
  <rect x="150" y="328" width="208" height="12" rx="6" fill="#F2B200"/>
  <rect x="84" y="352" width="250" height="12" rx="6" fill="#F2B200"/>
</g>
  <line x1="440" y1="95" x2="440" y2="385" stroke="#0E3B2E" stroke-width="8"/>
  <text id="TEXTO_JOATHI_EDITABLE" x="500" y="210" class="brand-title" font-size="112" fill="#0E3B2E">JOATHI</text>
  <text id="TEXTO_LOGISTICA_EDITABLE" x="505" y="330" class="brand-sub" font-size="56" fill="#0E3B2E">LOGISTICA</text>
</g>
</svg>
