<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" version="1.1">
<title>Joathi Logistica - Perfil Meta editable</title>
<defs>
  <linearGradient id="greenGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0E3B2E"/>
    <stop offset="100%" stop-color="#082A21"/>
  </linearGradient>
  <linearGradient id="yellowGrad" x1="0" y1="0" x2="1" y2="0">
