  <style>
    .brand-title { font-family: Montserrat, Arial, Helvetica, sans-serif; font-weight: 900; letter-spacing: 4px; }
    .brand-sub { font-family: Montserrat, Arial, Helvetica, sans-serif; font-weight: 700; letter-spacing: 12px; }
    .headline { font-family: Montserrat, Arial, Helvetica, sans-serif; font-weight: 900; letter-spacing: 1px; }
    .body { font-family: Montserrat, Arial, Helvetica, sans-serif; font-weight: 500; }
    .body-bold { font-family: Montserrat, Arial, Helvetica, sans-serif; font-weight: 800; }
    .small { font-family: Montserrat, Arial, Helvetica, sans-serif; font-weight: 600; letter-spacing: .5px; }
  </style>
</defs>
