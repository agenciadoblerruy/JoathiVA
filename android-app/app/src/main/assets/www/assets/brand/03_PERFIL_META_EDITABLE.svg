<circle cx="540" cy="540" r="220" fill="none" stroke="#2CA886" stroke-width="3" opacity="0.36"/>
<circle cx="540" cy="540" r="325" fill="none" stroke="#2CA886" stroke-width="3" opacity="0.36"/>
<circle cx="540" cy="540" r="395" fill="none" stroke="#2CA886" stroke-width="3" opacity="0.36"/>
